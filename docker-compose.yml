version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: logitrack-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logitrack_db
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    container_name: logitrack-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    volumes:
      - mongo_data:/data/db

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: logitrack-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  localstack:
    image: localstack/localstack:latest
    container_name: logitrack-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
    volumes:
      - "localstack_data:/var/lib/localstack"

  auth-service:
    build: ./auth-service
    container_name: logitrack-auth-service
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/logitrack_db?createDatabaseIfNotExist=true&serverTimezone=UTC

  user-service:
    build: ./user-service
    container_name: logitrack-user-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/logitrack_db?createDatabaseIfNotExist=true&serverTimezone=UTC

  order-service:
    build: ./order-service
    container_name: logitrack-order-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/logitrack_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  delivery-service:
    build: ./delivery-service
    container_name: logitrack-delivery-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/logitrack_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  tracking-service:
    build: ./tracking-service
    container_name: logitrack-tracking-service
    ports:
      - "8084:8084"
    depends_on:
      - mongodb
      - kafka
      - localstack
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017/logitrack_tracking_db?authSource=admin
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AWS_LOCALSTACK_ENDPOINT=http://localstack:4566

volumes:
  mysql_data:
  mongo_data:
  localstack_data: