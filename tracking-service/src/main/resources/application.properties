server.port=8084
spring.application.name=tracking-service

# Conexão com o banco de dados MongoDB (NoSQL)
spring.data.mongodb.uri=mongodb://admin:adminpassword@localhost:27017/logitrack_tracking_db?authSource=admin

# Configurações do Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=tracking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configurações para simulação AWS com LocalStack
aws.localstack.endpoint=http://localhost:4566
aws.region=us-east-1
